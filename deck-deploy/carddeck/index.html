<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FGOA 卡组编辑器</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, "Noto Sans CJK SC", sans-serif;
         background: #14161c; color: #dde1e8; display: flex; height: 100vh; overflow: hidden; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { padding: 8px 12px; background: #1d2029; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=search] { flex: 1; min-width: 160px; padding: 6px 10px; border-radius: 6px;
                       border: 1px solid #394050; background: #12141a; color: inherit; }
  select { padding: 6px; border-radius: 6px; border: 1px solid #394050; background: #12141a; color: inherit; }
  #grid { flex: 1; overflow-y: auto; display: grid; padding: 10px;
          grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; align-content: start; }
  .card { background: #1d2029; border: 2px solid transparent; border-radius: 8px; overflow: hidden;
          cursor: pointer; transition: border-color .15s; }
  .card:hover { border-color: #4a90d9; }
  .card.selected { border-color: #f0b429; }
  .card img { width: 100%; display: block; aspect-ratio: 240/371; background: #0c0e12; }
  .card .nm { padding: 4px 6px 2px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sub { padding: 0 6px 4px; font-size: 11px; color: #8a91a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pager { padding: 8px 12px; background: #1d2029; display: flex; gap: 10px; align-items: center; justify-content: center; }
  #side { width: 300px; background: #191c24; border-left: 1px solid #2a2f3c; display: flex; flex-direction: column; }
  #side h2 { margin: 0; padding: 12px; font-size: 15px; border-bottom: 1px solid #2a2f3c; }
  #deck { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .slot { display: flex; gap: 8px; background: #222634; border-radius: 8px; padding: 6px; align-items: center; }
  .slot img { width: 44px; border-radius: 4px; }
  .slot .info { flex: 1; min-width: 0; }
  .slot .info .t { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot .info .s { font-size: 11px; color: #8a91a0; }
  .slot button { width: 24px; height: 24px; border: 1px solid #394050; border-radius: 4px;
                 background: #12141a; color: inherit; cursor: pointer; }
  #savebar { padding: 10px 12px; border-top: 1px solid #2a2f3c; }
  #save { width: 100%; padding: 10px; border: 0; border-radius: 8px; font-size: 15px; font-weight: 600;
          background: #f0b429; color: #14161c; cursor: pointer; }
  #save:disabled { background: #394050; color: #8a91a0; cursor: default; }
  #msg { margin-top: 8px; font-size: 12px; min-height: 1.5em; }
  #msg.ok { color: #6fdc8c; } #msg.err { color: #ff7a7a; }
  button.pg { padding: 6px 14px; border: 1px solid #394050; border-radius: 6px; background: #12141a; color: inherit; cursor: pointer; }
  button.pg:disabled { opacity: .4; cursor: default; }
  .tag { font-size: 10px; padding: 1px 5px; border-radius: 4px; margin-left: 4px; }
  .tag.holo { background: #5a4a12; color: #ffd76a; }
  .tag.ce { background: #123a5a; color: #7ac2ff; }
  .tag.svt { background: #3a1250; color: #d97aff; }
</style>
</head>
<body>
<div id="main">
  <header>
    <input type="search" id="q" placeholder="搜索：中文名 / 日文名 / 卡号 / ID">
    <select id="ftype">
      <option value="">全部类型</option><option value="svt">从者</option><option value="ce">礼装</option>
    </select>
    <select id="ffinish">
      <option value="">全部版本</option><option value="normal">通常</option><option value="holo">闪卡</option>
    </select>
    <span id="count"></span>
  </header>
  <div id="grid"></div>
  <div id="pager">
    <button class="pg" id="prev">‹ 上一页</button>
    <span id="pageno"></span>
    <button class="pg" id="next">下一页 ›</button>
  </div>
</div>
<div id="side">
  <h2>当前卡组（<span id="deckcount">0</span>/5）</h2>
  <div id="deck"></div>
  <div id="savebar">
    <button id="save" disabled>写入 deck.json</button>
    <div id="msg"></div>
  </div>
</div>
<script>
const PAGE = 60, MAX_CARDS = 5, MAX_COPIES = 3;
let catalog = [], deck = [];   // deck: [{file, copies}]
let page = 0;

const $ = id => document.getElementById(id);
const zh = c => c.nameZh || c.nameJa;

async function boot() {
  catalog = await (await fetch('/catalog.json')).json();
  const cur = await (await fetch('/api/deck')).json();
  deck = (cur.cards || []).filter(c => c.file).map(c => ({file: c.file, copies: c.copies || 1}));
  if (cur.error) msg(cur.error, 'err');
  render();
}

function filtered() {
  const q = $('q').value.trim().toLowerCase(), t = $('ftype').value, f = $('ffinish').value;
  return catalog.filter(c =>
    (!t || c.type === t) && (!f || c.finish === f) &&
    (!q || (c.nameZh + c.nameJa).toLowerCase().includes(q) ||
           String(c.tcId).includes(q) || String(c.refId) === q));
}

function render() {
  const list = filtered();
  const pages = Math.max(1, Math.ceil(list.length / PAGE));
  page = Math.min(page, pages - 1);
  $('count').textContent = `${list.length} 张`;
  $('pageno').textContent = `${page + 1} / ${pages}`;
  $('prev').disabled = page <= 0;
  $('next').disabled = page >= pages - 1;
  const grid = $('grid');
  grid.innerHTML = '';
  const inDeck = new Map(deck.map(d => [d.file, d.copies]));
  for (const c of list.slice(page * PAGE, (page + 1) * PAGE)) {
    const div = document.createElement('div');
    div.className = 'card' + (inDeck.has(c.file) ? ' selected' : '');
    const badge = inDeck.has(c.file) ? ` ×${inDeck.get(c.file)}` : '';
    div.innerHTML = `<img loading="lazy" src="/img/${c.file}" alt="">
      <div class="nm">${esc(zh(c))}${badge}<span class="tag ${c.type}">${c.type === 'svt' ? '从者' : '礼装'}</span><span class="tag holo" ${c.finish === 'holo' ? '' : 'hidden'}>闪</span></div>
      <div class="sub">${esc(c.nameJa)} · #${c.tcId}</div>`;
    div.onclick = () => add(c.file);
    grid.appendChild(div);
  }
  renderDeck();
}

function renderDeck() {
  $('deckcount').textContent = deck.length;
  const box = $('deck');
  box.innerHTML = '';
  deck.forEach((d, i) => {
    const c = catalog.find(x => x.file === d.file) || {nameZh: d.file, nameJa: '', tcId: '?'};
    const div = document.createElement('div');
    div.className = 'slot';
    div.innerHTML = `<img src="/img/${d.file}" alt="">
      <div class="info"><div class="t">${esc(zh(c))}</div><div class="s">#${c.tcId}</div></div>
      <button data-a="-" ${d.copies <= 1 ? 'disabled' : ''}>-</button><span>${d.copies}</span>
      <button data-a="+" ${d.copies >= MAX_COPIES ? 'disabled' : ''}>+</button>
      <button data-a="x">✕</button>`;
    div.querySelectorAll('button').forEach(b => b.onclick = () => {
      if (b.dataset.a === '-') d.copies = Math.max(1, d.copies - 1);
      if (b.dataset.a === '+') d.copies = Math.min(MAX_COPIES, d.copies + 1);
      if (b.dataset.a === 'x') deck.splice(i, 1);
      render();
    });
    box.appendChild(div);
  });
  $('save').disabled = deck.length === 0;
}

function add(file) {
  const hit = deck.find(d => d.file === file);
  if (hit) { hit.copies = Math.min(MAX_COPIES, hit.copies + 1); }
  else if (deck.length < MAX_CARDS) { deck.push({file, copies: 1}); }
  else { msg(`最多 ${MAX_CARDS} 张卡`, 'err'); return; }
  render();
}

async function save() {
  $('save').disabled = true;
  try {
    const r = await (await fetch('/api/deck', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({cards: deck})
    })).json();
    if (r.ok) msg(`已写入 ${r.count} 张卡（重启游戏生效）`, 'ok');
    else msg(r.error || '写入失败', 'err');
  } catch (e) { msg(String(e), 'err'); }
  renderDeck();
}

function msg(t, cls) { const m = $('msg'); m.textContent = t; m.className = cls; }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

$('q').oninput = $('ftype').onchange = $('ffinish').onchange = () => { page = 0; render(); };
$('prev').onclick = () => { page--; render(); };
$('next').onclick = () => { page++; render(); };
$('save').onclick = save;
boot();
</script>
</body>
</html>
